# Overlay for GitHub Codespaces. Published ports must bind to all interfaces so the
# forwarded Codespaces tunnel can reach the Vite dev server.
services:
  web:
    environment:
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}
    ports: !override
      - "5173:5173"
  api:
    environment:
      # Keep synthetic acceptance free of provider charges. Run the local stack with
      # docker-compose.yml alone (no overlay) to use the configured provider.
      MODEL_PROVIDER: none
