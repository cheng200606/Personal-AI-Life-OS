[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-life-os"
version = "0.1.0"
description = "A privacy-conscious personal knowledge system for capturing, understanding, and reviewing life context."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Personal AI Life OS contributors" }]
dependencies = [
  "alembic>=1.13,<2.0",
  "boto3>=1.35,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "Pillow>=10,<13",
  "psycopg[binary]>=3.2,<4.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT>=2.9,<3.0",
  "python-multipart>=0.0.18,<1.0",
  "pytesseract>=0.3.13,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "typer>=0.12,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pypdf>=7.1.1",
  "python-docx>=1.2.0",
  "icalendar>=6,<7",
]

[project.scripts]
lifeos = "personal_ai_life_os.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
