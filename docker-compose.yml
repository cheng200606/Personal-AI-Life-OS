services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      LIFEOS_API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://lifeos:lifeos_dev@db:5432/lifeos
      DATA_DIR: /data
      OBJECT_STORE_BACKEND: local
      API_HOST: 0.0.0.0
      API_PORT: 8000
      AUTO_CREATE_SCHEMA: "false"
      PROCESSING_MODE: worker
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn personal_ai_life_os.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - lifeos_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lifeos_data:
  postgres_data:
